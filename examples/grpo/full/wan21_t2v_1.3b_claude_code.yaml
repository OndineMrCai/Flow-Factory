# Environment Configuration
launcher: "accelerate"
config_file: config/accelerate_configs/fsdp_grad_op_shard.yaml
num_processes: 8  # 8x H20 96GB — reward runs remotely, so all VRAM goes to the 1.3B policy
main_process_port: 29500
mixed_precision: "bf16"

# Data Configuration
data:
  dataset_dir: "dataset/videoscore2"  # Expects train.jsonl / test.jsonl with {"prompt", "negative_prompt"} per line
  preprocessing_batch_size: 8
  dataloader_num_workers: 8
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 3000

# Model Configuration
model:
  finetune_type: 'full'
  target_components: 'transformer'
  target_modules: "default"
  model_name_or_path: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
  model_type: "wan2_t2v"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'grpo'
  advantage_aggregation: 'sum'  # Single reward → 'sum' and 'gdpo' are equivalent

  # Clipping
  clip_range: 1.0e-4
  adv_clip_range: 5.0

  # KL div
  kl_type: 'v-based'
  kl_beta: 0  # Disabled for memory efficiency; enable (~1e-3) if training becomes unstable
  ref_param_device: 'cuda'

  # Sampling settings
  # Same conservative settings as the videoscore2 reference config
  resolution: 256
  num_frames: 5
  num_inference_steps: 10
  guidance_scale: 5.0

  # Batch and sampling
  per_device_batch_size: 1
  group_size: 8                       # 8 videos per prompt (GRPO group)
  global_std: false
  unique_sample_num_per_epoch: 32     # 32 prompts × 8 group_size = 256 videos/epoch
  gradient_step_per_epoch: 2

  # Optimization
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # EMA
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  # Gradient checkpointing
  enable_gradient_checkpointing: true

  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 0.9
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42
  flow_shift: 3.0  # 3.0 for 480p (5.0 for 720p)

# Evaluation settings
eval:
  resolution: 480
  num_frames: 17
  per_device_batch_size: 1
  guidance_scale: 5.0
  num_inference_steps: 28
  eval_freq: 0  # disabled temporarily to isolate SIGFPE crash
  seed: 42

# Reward Model Configuration
# Remote reward server wrapping the /video_eval Claude Code skill.
# Start the server separately:
#   python reward_server/claude_code_server.py \
#     --port 8000 \
#     --claude-model sonnet \
#     --visual-weight 1.0 --text-align-weight 1.0 --physical-weight 1.0 \
#     --store-fps 8.0 --max-workers 4
#
# The per-dimension weights live on the server (CLI flags) because
# RemotePointwiseRewardModel does not forward extra kwargs to the server.
rewards:
  - name: "claude_code_video_eval"
    reward_model: "flow_factory.rewards.my_reward_remote.RemotePointwiseRewardModel"
    server_url: "http://localhost:8000"
    weight: 1.0
    batch_size: 1            # server parallelizes internally via ThreadPoolExecutor
    device: "cuda"
    dtype: bfloat16
    timeout: 900.0           # each claude call can take a while per video
    retry_attempts: 3