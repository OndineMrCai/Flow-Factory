# Environment Configuration
launcher: "accelerate"
config_file: multinode_examples/fsdp2_wan.yaml  # FSDP2 HYBRID_SHARD: shard within node, replicate across nodes
# Multi-node: 4 nodes x 8 GPUs = 32 ranks. Each rank holds the 1.3B policy + VideoScore2 (~7B).
num_machines: 4
num_processes: 32
main_process_ip: "10.0.0.1"      # ← REPLACE with your master node's internal IP
main_process_port: 29500
# machine_rank: must be DIFFERENT per node (0..3). Set via MACHINE_RANK / NODE_RANK env var,
# which every cluster scheduler (K8s/Slurm/PAI/Volcano) injects automatically.
mixed_precision: "bf16"

# Data Configuration
data:
  dataset_dir: "dataset/videoscore2"  # Expects train.jsonl / test.jsonl with {"prompt", "negative_prompt"} per line
  preprocessing_batch_size: 8
  dataloader_num_workers: 8
  force_reprocess: true
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 3000

# Model Configuration
model:
  finetune_type: 'full'
  target_components: 'transformer'
  target_modules: "default"
  model_name_or_path: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
  model_type: "wan2_t2v"
  resume_path: null
  resume_type: null
  attn_backend: '_flash_3_hub'

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'grpo'
  advantage_aggregation: 'sum'  # Single reward → 'sum' and 'gdpo' are equivalent

  # Clipping
  clip_range: 1.0e-4
  adv_clip_range: 5.0

  # KL div
  kl_type: 'v-based'
  kl_beta: 0  # Disabled for memory efficiency; enable (~1e-3) if training becomes unstable
  ref_param_device: 'cuda'

  # Sampling settings — Wan2.1 native aspect ratio kept; frames/steps trimmed for RL loop speed.
  # Eval (below) still uses the full canonical 81-frame / 50-step setup.
  resolution: [480, 832]              # [height, width]; Wan2.1-T2V-1.3B native
  num_frames: 33                      # 4*8+1; ~2s @ 16fps. VS2 sees 33*(2/15)≈4 frames
  num_inference_steps: 8              # Flow-GRPO range (8-10); lower hurts sample quality / reward
  guidance_scale: 5.0                 # Slightly below eval's 6.0 to leave room for exploration

  # Batch and sampling
  per_device_batch_size: 1
  group_size: 8                       # Reduced from 16 to keep GPU memory in check
  global_std: false
  unique_sample_num_per_epoch: 32     # 32 unique prompts × 8 repetitions = 256 videos/epoch
  gradient_step_per_epoch: 2

  # Optimization
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # EMA
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  # Gradient checkpointing
  enable_gradient_checkpointing: true

  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 0.9
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42
  flow_shift: 3.0  # 3.0 for 480p (5.0 for 720p)

# Evaluation settings — exactly matches the VBench-2.0 sampling script's defaults for Wan2.1-T2V-1.3B
eval:
  resolution: [480, 832]              # 832x480, Wan2.1 native VBench resolution
  num_frames: 81                      # ~5.4s @ 15fps; canonical VBench length
  per_device_batch_size: 1
  guidance_scale: 6.0                 # Wan2.1 official VBench setting
  num_inference_steps: 50             # Full denoising for evaluation quality
  eval_freq: 0                        # Re-enable (e.g. 20) once SIGFPE is resolved
  seed: 42

# Reward Model Configuration
# VideoScore2 is a ~7B Qwen2-VL model – process one video at a time (batch_size: 1).
# It runs on the same CUDA device as the training model. If you hit OOM, consider
# using the Remote Reward Server approach (see guidance/rewards.md).
rewards:
  - name: "videoscore2"
    reward_model: "flow_factory.rewards.videoscore2.VideoScore2RewardModel"
    weight: 1.0
    batch_size: 1        # VLM; one video at a time
    device: "cuda"
    dtype: bfloat16
    # extra_kwargs passed to VideoScore2RewardModel.__init__
    model_name_or_path: "TIGER-Lab/VideoScore2"
    visual_weight: 1.0        # Weight for visual quality dimension
    text_align_weight: 1.0    # Weight for text-to-video alignment dimension
    physical_weight: 1.0      # Weight for physical/common-sense consistency dimension
    infer_fps: 2.0            # FPS for Qwen2-VL frame sampling
    store_fps: 15.0           # Wan2.1 native fps per VBench-2.0 sampling script. VLM sees num_frames*(infer/store) frames

# Optional: use a separate (possibly cheaper) reward at eval time
# eval_rewards:
#   - name: "clip_eval"
#     reward_model: "CLIP"
#     batch_size: 16
#     device: "cuda"
#     dtype: bfloat16
